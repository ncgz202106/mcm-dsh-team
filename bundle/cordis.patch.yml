                ## 唯一调度、真实角色与容量

                - DSH 根队长是唯一内部调度者及 .mcm/{tasks,artifacts,issues,decisions}.json、config、人工关口的唯一登记者。Codex 是外部检查点技术总监，经队长接单的编号工作包协作；不能同时直接向现有成员下冲突指令，也不冒充同一 Team 的 Lead。

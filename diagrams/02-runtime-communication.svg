<text x="84" y="259" font-size="26" fill="#2563eb" font-weight="700">建模手</text>
<text x="84" y="296" font-size="22" fill="#334155">子 Agent → 直接父级</text>
<rect id="n-lead" data-graph-role="node" data-node-id="lead" data-graph-bounds="540 220 900 350" x="540" y="220" width="360" height="130" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="540" y="235" width="5" height="100" rx="2" fill="#2563eb" data-graph-role="decoration"/>
<text x="564" y="259" font-size="26" fill="#2563eb" font-weight="700">建模负责人</text>
<text x="564" y="296" font-size="22" fill="#334155">父级汇总问题</text>
<rect id="n-captain" data-graph-role="node" data-node-id="captain" data-graph-bounds="1020 220 1380 350" x="1020" y="220" width="360" height="130" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="1020" y="235" width="5" height="100" rx="2" fill="#2563eb" data-graph-role="decoration"/>
<text x="1044" y="259" font-size="26" fill="#2563eb" font-weight="700">队长 / 共同父级</text>
<text x="1044" y="296" font-size="22" fill="#334155">跨分支路由</text>
<rect id="n-programmer" data-graph-role="node" data-node-id="programmer" data-graph-bounds="1500 220 1860 350" x="1500" y="220" width="360" height="130" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="1500" y="235" width="5" height="100" rx="2" fill="#2563eb" data-graph-role="decoration"/>
<text x="1524" y="259" font-size="26" fill="#2563eb" font-weight="700">编程手</text>
<text x="1524" y="296" font-size="22" fill="#334155">读取指定版本并响应</text>

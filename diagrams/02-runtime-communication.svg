<rect x="430" y="640" width="5" height="110" rx="2" fill="#0f766e" data-graph-role="decoration"/>
<text x="454" y="664" font-size="26" fill="#0f766e" font-weight="700">模型契约</text>
<text x="454" y="701" font-size="22" fill="#334155">假设、公式、接口</text>

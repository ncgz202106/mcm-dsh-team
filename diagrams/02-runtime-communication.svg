<rect id="n-invalidate" data-graph-role="node" data-node-id="invalidate" data-graph-bounds="60 820 1860 925" x="60" y="820" width="1800" height="105" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<rect x="60" y="835" width="5" height="75" rx="2" fill="#b91c1c" data-graph-role="decoration"/>
<text x="84" y="859" font-size="26" fill="#b91c1c" font-weight="700">上游变化 → 递归失效 → 重跑、复核、重新批准</text>
<text x="84" y="896" font-size="22" fill="#334155">数据或公式变化后，旧结果、图表、摘要数字不能继续作为最终证据；主文件只由论文负责人整合。</text>
<rect id="n-budget" data-graph-role="node" data-node-id="budget" data-graph-bounds="60 980 620 1140" x="60" y="980" width="560" height="160" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="60" y="995" width="5" height="130" rx="2" fill="#2563eb" data-graph-role="decoration"/>
<text x="84" y="1019" font-size="26" fill="#2563eb" font-weight="700">容量与原生派发门禁</text>
<text x="84" y="1056" font-size="22" fill="#334155">新鲜容量与任务证据 → 一次许可</text>
<text x="84" y="1089" font-size="22" fill="#334155">原生 spawn 受检；暂停或未知即拒绝</text>
<rect id="n-archive" data-graph-role="node" data-node-id="archive" data-graph-bounds="680 980 1240 1140" x="680" y="980" width="560" height="160" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<rect x="680" y="995" width="5" height="130" rx="2" fill="#7c3aed" data-graph-role="decoration"/>
<text x="704" y="1019" font-size="26" fill="#7c3aed" font-weight="700">AI 可见证据归档</text>
<text x="704" y="1056" font-size="22" fill="#334155">根会话 + 全部本地子会话</text>
<text x="704" y="1089" font-size="22" fill="#334155">模型、可见输入输出、用途与核验</text>
<rect id="n-check" data-graph-role="node" data-node-id="check" data-graph-bounds="1300 980 1860 1140" x="1300" y="980" width="560" height="160" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect x="1300" y="995" width="5" height="130" rx="2" fill="#b45309" data-graph-role="decoration"/>
<text x="1324" y="1019" font-size="26" fill="#b45309" font-weight="700">固定版本审阅</text>
<text x="1324" y="1056" font-size="22" fill="#334155">作者修复 → 原审阅者复验</text>
<text x="1324" y="1089" font-size="22" fill="#334155">缺失记录和未核验内容显式保留</text>
<text x="60" y="1200" font-size="21" fill="#475569">图例：蓝线 = 父子控制消息；绿线 = 版本化成果依赖。下排为执行约束。</text>

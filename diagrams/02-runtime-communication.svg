<rect width="1920" height="1280" fill="#ffffff" data-graph-role="background"/>
<text x="60" y="59" font-size="37" fill="#172554" font-weight="700">DSH 实际执行：消息路由与成果依赖</text>
<text x="60" y="103" font-size="22" fill="#475569">默认原生 spawn 指定专业预设；跨分支经队长转发版本化成果</text>
<text x="60" y="171" font-size="27" fill="#172554" font-weight="700">01  控制与通知：只传任务号、成果位置、版本、状态和问题摘要</text>
<rect id="n-worker" data-graph-role="node" data-node-id="worker" data-graph-bounds="60 220 420 350" x="60" y="220" width="360" height="130" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>

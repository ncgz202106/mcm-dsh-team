<rect id="n-manuscript" data-graph-role="node" data-node-id="manuscript" data-graph-bounds="1540 625 1860 765" x="1540" y="625" width="320" height="140" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect x="1540" y="640" width="5" height="110" rx="2" fill="#0f766e" data-graph-role="decoration"/>
<text x="1564" y="664" font-size="26" fill="#0f766e" font-weight="700">英文论文</text>
<text x="1564" y="701" font-size="22" fill="#334155">核心数字统一引用</text>

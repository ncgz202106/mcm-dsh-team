<path id="e-lead-captain" data-edge-id="lead-captain" data-graph-role="edge" data-source="lead" data-target="captain" d="M 900 285 L 1020 285" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#a0)"/>
<path id="e-captain-programmer" data-edge-id="captain-programmer" data-graph-role="edge" data-source="captain" data-target="programmer" d="M 1380 285 L 1500 285" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#a0)"/>
<rect id="n-routingrule" data-graph-role="node" data-node-id="routingrule" data-graph-bounds="60 400 1860 505" x="60" y="400" width="1800" height="105" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect x="60" y="415" width="5" height="75" rx="2" fill="#b45309" data-graph-role="decoration"/>
<text x="84" y="439" font-size="26" fill="#b45309" font-weight="700">任务交接与检查点</text>
<text x="84" y="476" font-size="22" fill="#334155">原生子树使用父子消息；Codex 交编号工作包给队长。收到、读取、执行、验收分别留证。</text>
<text x="60" y="575" font-size="27" fill="#172554" font-weight="700">02  文件依赖：读取共享成果，每项成果由唯一负责人写入</text>
<rect id="n-source" data-graph-role="node" data-node-id="source" data-graph-bounds="60 625 380 765" x="60" y="625" width="320" height="140" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
